<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rasa — Pemesanan</title>
<style>
:root{--ink:#20251f;--muted:#738078;--paper:#f6f7f2;--white:#fff;--green:#1d6b4b;--lime:#c7ef79;--line:#e7ebe4;--orange:#ef8c4a;--red:#b64242;--shadow:0 12px 32px #1a35200c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh}.top{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;gap:12px;align-items:center;font-weight:800;font-size:19px}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:20px}.topright{display:flex;align-items:center;gap:12px}.pill{border-radius:99px;padding:7px 12px;background:#edf5ec;color:var(--green);font-size:12px;font-weight:700}.btn{background:var(--green);color:white;border-radius:11px;padding:10px 15px;font-weight:700}.btn:hover{filter:brightness(.94)}.btn.light{background:#edf3ed;color:var(--green)}.btn.ghost{background:transparent;color:var(--muted)}.btn.red{background:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.content{max-width:1200px;margin:auto;padding:32px 24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--green);font-weight:800}.hero{display:flex;justify-content:space-between;align-items:end;margin:4px 0 24px}.hero h1{margin:4px 0;font-size:32px;letter-spacing:-.04em;line-height:1.15}.sub{color:var(--muted);margin:5px 0 0}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin:20px 0 24px;overflow:auto}.tab{padding:12px 15px;color:var(--muted);white-space:nowrap;background:none;border-bottom:2px solid transparent;font-weight:700}.tab.active{color:var(--green);border-color:var(--green)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.card{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:var(--shadow)}.statlabel{color:var(--muted);font-size:13px}.statnum{font-size:27px;font-weight:800;letter-spacing:-.04em;margin-top:7px}.statfoot{font-size:12px;color:var(--green);margin-top:3px}.twocol{grid-template-columns:1.3fr .7fr}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}.sectionhead h2{font-size:18px;margin:0}.orders{display:grid;gap:12px}.order{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:10px}.order-title{font-weight:800}.order-meta{font-size:13px;color:var(--muted);margin-top:3px}.orderitems{font-size:13px;margin-top:10px;color:#4a564e}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#fff2e7;color:#9b531e;font-size:11px;font-weight:800}.badge.green{background:#e8f4e9;color:var(--green)}.badge.gray{background:#f0f1ef;color:#59615b}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.order-actions{display:flex;align-items:center;gap:7px}.tablegrid{grid-template-columns:repeat(4,1fr)}.tablecard{min-height:120px}.tablecard b{font-size:19px}.tablecard p{margin:4px 0;color:var(--muted);font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;font-weight:700;color:#58645b}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:white;width:100%;outline-color:var(--green)}.field textarea{min-height:78px;resize:vertical}.menugrid{grid-template-columns:repeat(3,1fr)}.menuitem{overflow:hidden;padding:0}.menuphoto{height:148px;background:#edf1e8;display:grid;place-items:center;font-size:42px;color:#a0ae9f;overflow:hidden}.menuphoto img{width:100%;height:100%;object-fit:cover}.menubody{padding:14px}.menubody h3{font-size:16px;margin:0}.price{font-weight:800;color:var(--green);margin-top:6px}.muted{color:var(--muted)}.chart{height:145px;display:flex;align-items:end;gap:10px;padding-top:12px}.barwrap{flex:1;text-align:center;font-size:11px;color:var(--muted)}.bar{background:#bfdfb5;border-radius:7px 7px 2px 2px;min-height:4px;margin-bottom:6px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:11px 7px}.table th{color:var(--muted);font-weight:600}.overlay{position:fixed;inset:0;background:#1118;display:grid;place-items:center;z-index:10;padding:18px}.modal{background:white;border-radius:18px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px}.close{float:right;background:#f1f3f0;border-radius:9px;padding:6px 10px}.notice{padding:12px 14px;border-radius:12px;background:#f3f6ef;color:#516050;font-size:13px;margin:12px 0}.loginwrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:24px}.login{width:min(430px,100%);padding:30px}.login h1{font-size:26px;margin:6px 0}.login p{color:var(--muted)}.loginlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.loginlinks button{font-size:12px}.customerlayout{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}.cart{position:sticky;top:94px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:27px;height:27px;border-radius:8px;background:#eef3ed;color:var(--green);font-weight:800}.lineitem{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.empty{text-align:center;padding:34px;color:var(--muted)}.footer{padding:28px;text-align:center;color:#8b958d;font-size:12px}.hide{display:none!important}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.twocol,.customerlayout{grid-template-columns:1fr}.cart{position:static}.menugrid{grid-template-columns:repeat(2,1fr)}.tablegrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.top{padding:0 15px}.content{padding:24px 15px}.hero{align-items:start;gap:10px;flex-direction:column}.hero h1{font-size:27px}.menugrid{grid-template-columns:1fr 1fr;gap:10px}.menuphoto{height:110px}.card{padding:15px}.stats{gap:10px}.statnum{font-size:23px}.formgrid{grid-template-columns:1fr}.order{grid-template-columns:1fr}.order-actions{justify-content:flex-start}.topright .pill{display:none}}
</style></head><body><div id="app"></div><div id="modal"></div>
<script>
const KEY='rasa_warmindo_v1';
const seed={settings:{name:'Rasa Warmindo',currency:'Rp'},users:[{user:'owner',pass:'owner123',role:'owner',name:'Pemilik'},{user:'kasir',pass:'kasir123',role:'kasir',name:'Kasir'},{user:'koki',pass:'koki123',role:'koki',name:'Dapur'}],tables:Array.from({length:12},(_,i)=>({id:i+1,code:'MEJA-'+String(i+1).padStart(2,'0')})),menu:[{id:1,name:'Indomie Goreng Spesial',category:'Mie',price:15000,cost:8000,description:'Indomie goreng dengan telur dan topping pilihan.',image:'',emoji:'🍜',active:true},{id:2,name:'Nasi Goreng Kampung',category:'Makanan',price:18000,cost:10000,description:'Nasi goreng gurih dengan telur.',image:'',emoji:'🍳',active:true},{id:3,name:'Es Teh Manis',category:'Minuman',price:5000,cost:1500,description:'Teh segar, dingin atau hangat.',image:'',emoji:'🧋',active:true},{id:4,name:'Roti Bakar Cokelat',category:'Camilan',price:12000,cost:6000,description:'Roti bakar renyah isi cokelat.',image:'',emoji:'🍞',active:true}],orders:[],nextOrder:1};
let db=load(),user=null,view='login',customerTable=null,cart={},filter='Semua';function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{return structuredClone(seed)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}const rupiah=n=>'Rp '+Number(n||0).toLocaleString('id-ID');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const activeOrders=()=>db.orders.filter(o=>o.status!=='Selesai');const dateNow=()=>new Date().toISOString();function fmt(t){return new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}function mins(a,b=Date.now()){return Math.max(0,Math.round((b-new Date(a))/60000))}function roleLabel(r){return {owner:'Owner',kasir:'Kasir',koki:'Dapur'}[r]||r}
function base(content){document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="brandmark">✳</div><span>${esc(db.settings.name)}</span></div><div class="topright">${user?`<span class="pill">${roleLabel(user.role)} · ${esc(user.name)}</span><button class="btn light small" onclick="logout()">Keluar</button>`:`<span class="pill">Demo localhost</span>`}</div></header>${content}<div class="footer">${esc(db.settings.name)} · Sistem demo pemesanan • Data tersimpan di browser ini</div></div>`}
function loginPage(){view='login';base(`<main class="loginwrap"><section class="card login"><div class="eyebrow">Sistem pemesanan digital</div><h1>Selamat datang 👋</h1><p>Masuk sesuai peran untuk mengelola operasional restoran.</p><form onsubmit="login(event)"><div class="field"><label>Nama pengguna</label><input name="user" required placeholder="Contoh: owner"></div><div class="field"><label>Kata sandi</label><input name="pass" type="password" required placeholder="Masukkan kata sandi"></div><div id="loginerror" class="muted"></div><button class="btn" style="width:100%;margin-top:10px">Masuk ke aplikasi</button></form><div class="notice"><b>Akun untuk mencoba</b><br>Owner: owner / owner123<br>Kasir: kasir / kasir123<br>Koki: koki / koki123</div><div class="loginlinks"><button class="btn light small" onclick="tableLogin()">Buka menu pelanggan</button><button class="btn ghost small" onclick="showQR()">Lihat QR meja</button></div></section></main>`)}
function login(e){e.preventDefault();let f=new FormData(e.target),u=db.users.find(x=>x.user===f.get('user')&&x.pass===f.get('pass'));if(!u){document.getElementById('loginerror').innerHTML='<span style="color:#b64242">Nama pengguna atau kata sandi salah.</span>';return}user=u;dashboard()}
function logout(){user=null;loginPage()}function dashboard(){if(!user)return loginPage();view=user.role;base(user.role==='owner'?ownerPage():user.role==='kasir'?cashierPage():kitchenPage())}
function heading(title,sub,button=''){return `<div class="hero"><div><div class="eyebrow">${roleLabel(user.role)} · Ringkasan operasional</div><h1>${title}</h1><p class="sub">${sub}</p></div>${button}</div>`}
function statusBadge(s){let c=s==='Selesai'||s==='Siap dihidangkan'||s==='Sudah dibayar'?'green':s==='Menunggu pembayaran'?'gray':'';return `<span class="badge ${c}">${esc(s)}</span>`}
function orderCard(o,actions=false){let lines=o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ');return `<article class="order"><div><div class="row"><span class="order-title">${esc(o.number)} · Meja ${o.table}</span>${statusBadge(o.status)}</div><div class="order-meta">${fmt(o.createdAt)} · ${o.payment==='QRIS'?'QRIS / cashless':o.payment==='Tunai'?'Tunai':'Belum memilih pembayaran'} · ${mins(o.createdAt)} menit berjalan</div><div class="orderitems">${lines}</div><div class="order-meta"><b>${rupiah(o.total)}</b>${o.note?` · Catatan: ${esc(o.note)}`:''}</div></div>${actions?`<div class="order-actions">${orderButtons(o)}</div>`:''}</article>`}
function orderButtons(o){if(user.role==='koki'&&o.status==='Diproses')return `<button class="btn small" onclick="setStatus(${o.id},'Siap dihidangkan')">Tandai siap</button>`;if(user.role==='kasir'&&o.status==='Menunggu pembayaran')return `<button class="btn small" onclick="payCash(${o.id})">Terima tunai</button>`;if(user.role==='kasir'&&o.status==='Siap dihidangkan')return `<span class="muted">Menunggu diantar</span>`;if(o.status==='Menunggu pembayaran')return `<button class="btn light small" onclick="payQR(${o.id})">Konfirmasi QRIS</button>`;if(o.status==='Siap dihidangkan')return `<button class="btn light small" onclick="setStatus(${o.id},'Selesai')">Selesaikan</button>`;return ''}
function ownerPage(){let today=new Date().toDateString(),tod=db.orders.filter(o=>new Date(o.createdAt).toDateString()===today),sales=tod.filter(o=>o.status!=='Menunggu pembayaran').reduce((s,o)=>s+o.total,0),profit=tod.filter(o=>o.status!=='Menunggu pembayaran').reduce((s,o)=>s+o.profit,0),orders=activeOrders();return `<main class="content">${heading('Ringkasan bisnis','Pantau pesanan, menu, dan kinerja hari ini.',`<button class="btn" onclick="openSettings()">⚙ Pengaturan</button>`)}<div class="grid stats"><div class="card"><div class="statlabel">Penjualan hari ini</div><div class="statnum">${rupiah(sales)}</div><div class="statfoot">${tod.length} pesanan tercatat</div></div><div class="card"><div class="statlabel">Estimasi laba kotor</div><div class="statnum">${rupiah(profit)}</div><div class="statfoot">Harga jual dikurangi modal menu</div></div><div class="card"><div class="statlabel">Pesanan aktif</div><div class="statnum">${orders.length}</div><div class="statfoot">Sedang berjalan sekarang</div></div><div class="card"><div class="statlabel">Rata-rata durasi</div><div class="statnum">${avgDuration()} mnt</div><div class="statfoot">Dari pesanan yang selesai</div></div></div><div class="tabs"><button class="tab active" onclick="ownerTab('overview',this)">Ringkasan</button><button class="tab" onclick="ownerTab('menu',this)">Menu & harga</button><button class="tab" onclick="ownerTab('orders',this)">Semua pesanan</button><button class="tab" onclick="ownerTab('tables',this)">Meja & QR</button><button class="tab" onclick="ownerTab('report',this)">Laporan</button></div><div id="ownercontent">${ownerOverview()}</div></main>`}
function avgDuration(){let done=db.orders.filter(o=>o.doneAt&&o.servedAt);return done.length?Math.round(done.reduce((s,o)=>s+(new Date(o.servedAt)-new Date(o.createdAt))/60000,0)/done.length):0}
function ownerOverview(){let arr=activeOrders();return `<div class="grid twocol"><section><div class="sectionhead"><h2>Pesanan yang sedang berjalan</h2><span class="pill">${arr.length} aktif</span></div><div class="orders">${arr.length?arr.map(o=>orderCard(o,true)).join(''):'<div class="card empty">Belum ada pesanan aktif. QR meja siap dibagikan.</div>'}</div></section><section><div class="card"><div class="sectionhead"><h2>Penjualan 7 hari</h2></div>${salesChart()}<div class="notice">Angka laba memakai modal per menu yang dimasukkan owner. Biaya sewa, gaji, dan operasional belum dihitung.</div></div><div class="card" style="margin-top:14px"><div class="sectionhead"><h2>Menu terlaris</h2></div>${popularMenu()}</div></section></div>`}
function salesChart(){let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let total=db.orders.filter(o=>new Date(o.createdAt).toDateString()===d.toDateString()&&o.status!=='Menunggu pembayaran').reduce((s,o)=>s+o.total,0);days.push({label:d.toLocaleDateString('id-ID',{weekday:'short'}),total})}let max=Math.max(...days.map(x=>x.total),1);return `<div class="chart">${days.map(x=>`<div class="barwrap"><div class="bar" style="height:${Math.max(5,x.total/max*110)}px"></div>${x.label}</div>`).join('')}</div>`}
function popularMenu(){let c={};db.orders.filter(o=>o.status!=='Menunggu pembayaran').forEach(o=>o.items.forEach(i=>c[i.name]=(c[i.name]||0)+i.qty));let rows=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4);return rows.length?rows.map(([n,q])=>`<div class="lineitem"><span>${esc(n)}</span><b>${q} terjual</b></div>`).join(''):'<div class="muted">Data penjualan akan tampil setelah ada pesanan.</div>'}
function ownerTab(t,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');let c=document.getElementById('ownercontent');c.innerHTML=t==='overview'?ownerOverview():t==='menu'?menuAdmin():t==='orders'?allOrders():t==='tables'?tablesPage():reportsPage()}
function menuAdmin(){return `<div class="sectionhead"><h2>Daftar menu</h2><button class="btn" onclick="editMenu()">＋ Tambah menu</button></div><div class="grid menugrid">${db.menu.map(m=>`<div class="card menuitem"><div class="menuphoto">${m.image?`<img src="${m.image}">`:m.emoji}</div><div class="menubody"><div class="row" style="justify-content:space-between"><h3>${esc(m.name)}</h3>${m.active?'<span class="badge green">Aktif</span>':'<span class="badge gray">Nonaktif</span>'}</div><div class="muted">${esc(m.category)} · Modal ${rupiah(m.cost)}</div><div class="price">${rupiah(m.price)}</div><p class="muted" style="font-size:13px">${esc(m.description)}</p><div class="row"><button class="btn light small" onclick="editMenu(${m.id})">Edit</button><button class="btn ghost small" onclick="toggleMenu(${m.id})">${m.active?'Nonaktifkan':'Aktifkan'}</button></div></div></div>`).join('')}</div>`}
function allOrders(){return `<div class="sectionhead"><h2>Riwayat dan status pesanan</h2><span class="muted">Waktu dicatat otomatis</span></div><div class="orders">${[...db.orders].reverse().length?[...db.orders].reverse().map(o=>orderCard(o,true)).join(''):'<div class="card empty">Belum ada pesanan.</div>'}</div>`}
function tablesPage(){return `<div class="sectionhead"><h2>Meja dan QR pesanan</h2><button class="btn" onclick="addTable()">＋ Tambah meja</button></div><div class="notice">Tampilkan QR di meja. Pelanggan yang memindai akan membuka menu dengan nomor meja tersebut.</div><div class="grid tablegrid">${db.tables.map(t=>`<div class="card tablecard"><div class="row" style="justify-content:space-between"><b>Meja ${t.id}</b><button class="btn light small" onclick="makeQR(${t.id})">Tampilkan QR</button></div><p>Kode: ${t.code}</p></div>`).join('')}</div>`}
function reportsPage(){let rows=db.orders.filter(o=>o.status!=='Menunggu pembayaran');let sales=rows.reduce((s,o)=>s+o.total,0),cost=rows.reduce((s,o)=>s+o.cost,0),cash=rows.filter(o=>o.payment==='Tunai').reduce((s,o)=>s+o.total,0),digital=sales-cash;return `<div class="grid stats"><div class="card"><div class="statlabel">Total penjualan tercatat</div><div class="statnum">${rupiah(sales)}</div></div><div class="card"><div class="statlabel">Estimasi modal</div><div class="statnum">${rupiah(cost)}</div></div><div class="card"><div class="statlabel">Laba kotor estimasi</div><div class="statnum">${rupiah(sales-cost)}</div></div><div class="card"><div class="statlabel">Tunai / digital</div><div class="statnum" style="font-size:19px">${rupiah(cash)} / ${rupiah(digital)}</div></div></div><div class="card"><div class="sectionhead"><h2>Riwayat transaksi</h2><button class="btn light small" onclick="downloadCSV()">Unduh CSV</button></div><table class="table"><thead><tr><th>No.</th><th>Waktu</th><th>Meja</th><th>Pembayaran</th><th>Total</th><th>Laba kotor</th><th>Durasi</th></tr></thead><tbody>${rows.slice().reverse().map(o=>`<tr><td>${esc(o.number)}</td><td>${fmt(o.createdAt)}</td><td>${o.table}</td><td>${o.payment}</td><td>${rupiah(o.total)}</td><td>${rupiah(o.profit)}</td><td>${o.servedAt?mins(o.createdAt,o.servedAt)+' mnt':'Berjalan'}</td></tr>`).join('')}</tbody></table></div><div class="notice">Demo ini menghitung laba kotor dari modal bahan per menu. Untuk laporan keuangan resmi, catat juga biaya lain dan rekonsiliasi pembayaran.</div>`}
function cashierPage(){let arr=activeOrders();return `<main class="content">${heading('Meja kasir','Kelola pembayaran tunai dan pantau semua pesanan.') }<div class="grid stats"><div class="card"><div class="statlabel">Menunggu pembayaran tunai</div><div class="statnum">${db.orders.filter(o=>o.status==='Menunggu pembayaran').length}</div></div><div class="card"><div class="statlabel">Pesanan aktif</div><div class="statnum">${arr.length}</div></div><div class="card"><div class="statlabel">Pembayaran tunai hari ini</div><div class="statnum">${rupiah(db.orders.filter(o=>o.payment==='Tunai'&&new Date(o.createdAt).toDateString()===new Date().toDateString()).reduce((s,o)=>s+o.total,0))}</div></div><div class="card"><div class="statlabel">Siap dihidangkan</div><div class="statnum">${db.orders.filter(o=>o.status==='Siap dihidangkan').length}</div></div></div><div class="sectionhead"><h2>Semua pesanan</h2><button class="btn light" onclick="tableLogin()">Buka pelanggan</button></div><div class="orders">${[...db.orders].reverse().length?[...db.orders].reverse().map(o=>orderCard(o,true)).join(''):'<div class="card empty">Belum ada pesanan.</div>'}</div></main>`}
function kitchenPage(){let arr=db.orders.filter(o=>o.status==='Diproses'||o.status==='Siap dihidangkan');return `<main class="content">${heading('Layar dapur','Pesanan baru tampil otomatis di sini setelah pelanggan mengirim pesanan.')}<div class="grid stats"><div class="card"><div class="statlabel">Perlu disiapkan</div><div class="statnum">${db.orders.filter(o=>o.status==='Diproses').length}</div></div><div class="card"><div class="statlabel">Siap dihidangkan</div><div class="statnum">${db.orders.filter(o=>o.status==='Siap dihidangkan').length}</div></div><div class="card"><div class="statlabel">Rata-rata durasi selesai</div><div class="statnum">${avgDuration()} mnt</div></div><div class="card"><div class="statlabel">Total hari ini</div><div class="statnum">${db.orders.filter(o=>new Date(o.createdAt).toDateString()===new Date().toDateString()).length}</div></div></div><div class="sectionhead"><h2>Antrian dapur</h2><span class="pill">${arr.length} pesanan</span></div><div class="orders">${arr.length?arr.map(o=>orderCard(o,true)).join(''):'<div class="card empty">Dapur kosong. Pesanan baru akan muncul di sini.</div>'}</div></main>`}
function setStatus(id,status){let o=db.orders.find(x=>x.id===id);o.status=status;if(status==='Siap dihidangkan')o.readyAt=dateNow();if(status==='Selesai'){o.doneAt=dateNow();o.servedAt=dateNow()}save();dashboard()}
function payCash(id){let o=db.orders.find(x=>x.id===id);o.payment='Tunai';o.paidAt=dateNow();o.status='Diproses';save();dashboard()}
function payQR(id){let o=db.orders.find(x=>x.id===id);o.payment='QRIS';o.paidAt=dateNow();o.status='Diproses';save();dashboard();alert('Pembayaran demo dikonfirmasi. Untuk QRIS nyata, gunakan QRIS resmi merchant dan verifikasi transaksi melalui penyedia pembayaran.')}
function editMenu(id){let m=db.menu.find(x=>x.id===id)||{id:null,name:'',category:'Makanan',price:'',cost:'',description:'',image:'',emoji:'🍽️',active:true};openModal(`<button class="close" onclick="closeModal()">Tutup</button><h2>${id?'Ubah menu':'Tambah menu'}</h2><form onsubmit="saveMenu(event,${id||'null'})"><div class="field"><label>Nama menu</label><input name="name" required value="${esc(m.name)}"></div><div class="formgrid"><div class="field"><label>Kategori</label><input name="category" value="${esc(m.category)}"></div><div class="field"><label>Harga jual (Rp)</label><input name="price" type="number" required min="0" value="${m.price}"></div><div class="field"><label>Modal per porsi (Rp)</label><input name="cost" type="number" min="0" value="${m.cost}"></div><div class="field"><label>Emoji jika tanpa foto</label><input name="emoji" value="${esc(m.emoji)}"></div></div><div class="field"><label>Deskripsi</label><textarea name="description">${esc(m.description)}</textarea></div><div class="field"><label>Foto menu (opsional)</label><input name="image" type="file" accept="image/*" onchange="previewImage(event)"><input type="hidden" name="imageData" value="${m.image||''}"><div id="imgpreview">${m.image?`<img src="${m.image}" style="width:100px;border-radius:10px">`:''}</div></div><button class="btn">Simpan menu</button></form>`)}
function previewImage(e){let f=e.target.files[0];if(!f)return;if(f.size>850000){alert('Ukuran foto maksimal 850 KB agar penyimpanan browser tidak penuh.');e.target.value='';return}let r=new FileReader();r.onload=()=>{document.querySelector('[name=imageData]').value=r.result;document.getElementById('imgpreview').innerHTML=`<img src="${r.result}" style="width:100px;border-radius:10px">`};r.readAsDataURL(f)}
function saveMenu(e,id){e.preventDefault();let f=new FormData(e.target),old=id?db.menu.find(m=>m.id===id):null,obj={id:id||Date.now(),name:f.get('name'),category:f.get('category'),price:+f.get('price'),cost:+f.get('cost')||0,description:f.get('description'),image:f.get('imageData'),emoji:f.get('emoji')||'🍽️',active:old?old.active:true};if(old)Object.assign(old,obj);else db.menu.push(obj);save();closeModal();dashboard();setTimeout(()=>{let tab=[...document.querySelectorAll('.tab')].find(x=>x.textContent.includes('Menu'));if(tab)ownerTab('menu',tab)},0)}function toggleMenu(id){let m=db.menu.find(x=>x.id===id);m.active=!m.active;save();dashboard();setTimeout(()=>{let t=[...document.querySelectorAll('.tab')].find(x=>x.textContent.includes('Menu'));if(t)ownerTab('menu',t)},0)}
function openSettings(){openModal(`<button class="close" onclick="closeModal()">Tutup</button><h2>Pengaturan restoran</h2><form onsubmit="saveSettings(event)"><div class="field"><label>Nama restoran / warmindo</label><input name="name" value="${esc(db.settings.name)}" required></div><button class="btn">Simpan nama</button></form><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Akun demo</h3><p class="muted">Ganti kata sandi sebelum penggunaan nyata. Demo ini tidak memiliki server akun terpusat.</p><div class="orders">${db.users.map(u=>`<div class="lineitem"><span>${roleLabel(u.role)} · ${u.user}</span><button class="btn light small" onclick="changePass('${u.user}')">Ganti sandi</button></div>`).join('')}</div><button class="btn ghost small" style="margin-top:20px" onclick="resetDemo()">Reset semua data demo</button>`)}function saveSettings(e){e.preventDefault();db.settings.name=new FormData(e.target).get('name');save();closeModal();dashboard()}function changePass(u){let p=prompt('Masukkan kata sandi baru (minimal 6 karakter):');if(!p)return;if(p.length<6){alert('Kata sandi minimal 6 karakter.');return}db.users.find(x=>x.user===u).pass=p;save();openSettings()}function resetDemo(){if(confirm('Hapus seluruh pesanan dan kembalikan data demo awal?')){localStorage.removeItem(KEY);db=structuredClone(seed);save();user=null;loginPage();closeModal()}}
function addTable(){let id=Math.max(0,...db.tables.map(t=>t.id))+1;db.tables.push({id,code:'MEJA-'+String(id).padStart(2,'0')});save();dashboard();setTimeout(()=>{let t=[...document.querySelectorAll('.tab')].find(x=>x.textContent.includes('Meja'));if(t)ownerTab('tables',t)},0)}function makeQR(id){let url=location.href.split('?')[0]+'?meja='+id;openModal(`<button class="close" onclick="closeModal()">Tutup</button><h2>QR Meja ${id}</h2><p class="muted">Cetak atau tampilkan QR ini di meja. Saat discan, pelanggan membuka menu pada perangkatnya.</p><div id="qr" style="display:grid;place-items:center;padding:12px"></div><div class="notice" style="word-break:break-all">${url}</div><button class="btn" onclick="window.print()">Cetak QR</button><button class="btn light" onclick="tableLogin(${id})">Coba sebagai pelanggan</button><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById('qr'),{text:${JSON.stringify(url)},width:200,height:200});<\/script>`)}function showQR(){openModal(`<button class="close" onclick="closeModal()">Tutup</button><h2>QR meja</h2><div class="grid tablegrid">${db.tables.map(t=>`<button class="btn light" onclick="closeModal();makeQR(${t.id})">Buat QR meja ${t.id}</button>`).join('')}</div>`)}function tableLogin(id){customerTable=id||Number(new URLSearchParams(location.search).get('meja'))||1;cart={};customerPage()}
function customerPage(){view='customer';let cats=['Semua',...new Set(db.menu.filter(m=>m.active).map(m=>m.category))],items=db.menu.filter(m=>m.active&&(filter==='Semua'||m.category===filter));let q=Object.values(cart).reduce((s,x)=>s+x.qty,0),total=Object.values(cart).reduce((s,x)=>s+x.qty*x.price,0);base(`<main class="content"><div class="hero"><div><div class="eyebrow">Pesan dari meja ${customerTable}</div><h1>${esc(db.settings.name)},<br>siap menemani harimu.</h1><p class="sub">Pilih menu favorit, kami siapkan dengan hangat.</p></div><button class="btn light" onclick="customerOrders()">Pesanan saya</button></div><div class="tabs">${cats.map(c=>`<button class="tab ${filter===c?'active':''}" onclick="filter='${esc(c)}';customerPage()">${esc(c)}</button>`).join('')}</div><div class="customerlayout"><section class="grid menugrid">${items.map(m=>`<article class="card menuitem"><div class="menuphoto">${m.image?`<img src="${m.image}">`:m.emoji}</div><div class="menubody"><div class="muted" style="font-size:11px">${esc(m.category)}</div><h3>${esc(m.name)}</h3><p class="muted" style="font-size:13px;min-height:36px">${esc(m.description)}</p><div class="row" style="justify-content:space-between"><span class="price">${rupiah(m.price)}</span><button class="btn small" onclick="addCart(${m.id})">＋ Tambah</button></div></div></article>`).join('')}</section><aside class="card cart"><div class="sectionhead"><h2>Keranjang</h2><span class="pill">${q} item</span></div>${q?Object.values(cart).map(x=>`<div class="lineitem"><div><b>${esc(x.name)}</b><div class="muted">${rupiah(x.price)}</div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button>${x.qty}<button onclick="changeQty(${x.id},1)">＋</button></div></div><b>${rupiah(x.qty*x.price)}</b></div>`).join(''):'<div class="empty">Pilih menu untuk mulai memesan.</div>'}<div class="field" style="margin-top:14px"><label>Catatan untuk dapur (opsional)</label><input id="note" placeholder="Contoh: tidak pedas"></div><div class="lineitem"><b>Total</b><b>${rupiah(total)}</b></div><button class="btn" style="width:100%;margin-top:13px" ${q?'':'disabled'} onclick="checkout()">Lanjutkan pesanan</button><div class="notice">Pembayaran digital pada demo perlu konfirmasi. Jangan gunakan untuk transaksi nyata.</div></aside></div></main>`)}function addCart(id){let m=db.menu.find(x=>x.id===id);if(!cart[id])cart[id]={...m,qty:0};cart[id].qty++;customerPage()}function changeQty(id,n){cart[id].qty+=n;if(cart[id].qty<=0)delete cart[id];customerPage()}function checkout(){let items=Object.values(cart).map(x=>({id:x.id,name:x.name,qty:x.qty,price:x.price,cost:x.cost})),total=items.reduce((s,x)=>s+x.qty*x.price,0),cost=items.reduce((s,x)=>s+x.qty*x.cost,0),o={id:db.nextOrder++,number:'ORD-'+String(db.nextOrder-1).padStart(4,'0'),table:customerTable,items,total,cost,profit:total-cost,note:document.getElementById('note').value,createdAt:dateNow(),status:'Menunggu pembayaran',payment:'Belum dipilih'};db.orders.push(o);save();cart={};openModal(`<h2>Pesanan berhasil dibuat 🎉</h2><p>Nomor pesanan <b>${o.number}</b> · Meja ${o.table}</p><p>Total pembayaran <b>${rupiah(total)}</b></p><div class="grid"><button class="btn" onclick="choosePay(${o.id},'QRIS')">Bayar QRIS / cashless</button><button class="btn light" onclick="choosePay(${o.id},'Tunai')">Bayar tunai di kasir</button></div><p class="notice">Untuk QRIS nyata, aplikasi perlu integrasi penyedia pembayaran. Tombol demo hanya mencatat pilihan.</p>`)}function choosePay(id,p){let o=db.orders.find(x=>x.id===id);if(p==='QRIS'){o.payment='Menunggu QRIS';o.status='Menunggu pembayaran';}else{o.payment='Tunai';o.status='Menunggu pembayaran'}save();closeModal();customerOrders()}function customerOrders(){view='customer';let arr=db.orders.filter(o=>o.table===customerTable).slice().reverse();base(`<main class="content"><button class="btn light small" onclick="customerPage()">← Kembali ke menu</button><div class="hero" style="margin-top:18px"><div><div class="eyebrow">Meja ${customerTable}</div><h1>Status pesanan</h1><p class="sub">Pantau status dan durasi pesananmu.</p></div></div><div class="orders">${arr.length?arr.map(o=>`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(o.number)}</h2>${statusBadge(o.status)}</div><p class="muted">${fmt(o.createdAt)} · berjalan ${mins(o.createdAt)} menit</p><p>${o.items.map(i=>`${i.qty}× ${esc(i.name)}`).join(' · ')}</p><b>${rupiah(o.total)}</b><p class="muted">${o.payment==='Tunai'?'Silakan bayar di kasir.':o.payment==='Menunggu QRIS'?'Menunggu instruksi QRIS dari kasir.':o.payment==='QRIS'?'Pembayaran digital tercatat.':'Pilih metode pembayaran.'}</p>${o.status==='Menunggu pembayaran'?`<div class="row"><button class="btn small" onclick="choosePay(${o.id},'QRIS')">Pilih QRIS</button><button class="btn light small" onclick="choosePay(${o.id},'Tunai')">Pilih tunai</button></div>`:''}</div>`).join(''):'<div class="card empty">Belum ada pesanan pada meja ini.</div>'}</div></main>`)}function openModal(html){document.getElementById('modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}
function downloadCSV(){let rows=[['Nomor','Waktu','Meja','Status','Pembayaran','Total','Modal','Laba kotor','Durasi menit'],...db.orders.map(o=>[o.number,fmt(o.createdAt),o.table,o.status,o.payment,o.total,o.cost,o.profit,o.servedAt?mins(o.createdAt,o.servedAt):''])],csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='laporan-pesanan.csv';a.click();URL.revokeObjectURL(a.href)}
function init(){let t=Number(new URLSearchParams(location.search).get('meja'));if(t){customerTable=t;customerPage()}else loginPage();setInterval(()=>{if(user)dashboard()},30000)}init();
</script></body></html>
